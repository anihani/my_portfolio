<!-- Applies the saved theme before the page paints, so there is no flash. With nothing saved, the site is dark. -->
<!-- It also marks the page as JavaScript-enabled, so scroll animations only hide content when they can reveal it. -->
<script>
  (function () {
    var root = document.documentElement;
    root.classList.add('js');
    var theme = 'dark';
    try {
      var saved = localStorage.getItem('ak-theme');
      if (saved === 'light' || saved === 'dark') theme = saved;
    } catch (e) {}
    root.setAttribute('data-theme', theme);
  })();
</script>
